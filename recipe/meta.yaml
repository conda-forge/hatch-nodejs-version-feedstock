{% set version = "0.4.0" %}

package:
  name: hatch-nodejs-version
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hatch-nodejs-version/hatch_nodejs_version-{{ version }}.tar.gz
  sha256: 2428ea398dd053f019d2b7ac949dd6b690ca8e826b6d433ad13c5b6c475ae91b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - hatchling >=0.21.0
    - python >={{ python_min }}

test:
  source_files:
    - tests
  requires:
    - m2-grep  # [win]
    - pip
    - pytest >=7.0.1
    - pytest-cov
    - python {{ python_min }}
  imports:
    - hatch_nodejs_version
  commands:
    - pip check
    - pip list
    - pip list | grep -iE 'hatch-nodejs-version\s*{{ version.replace('.', '\.') }}'
    - pytest -vvv --capture=tee-sys --cov=hatch_nodejs_version --cov-report=term-missing:skip-covered --no-cov-on-fail --cov-fail-under=80

about:
  home: https://github.com/agoose77/hatch-nodejs-version
  summary: Hatch plugin for versioning from a package.json file
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - bollwyvl
    - agoose77
    - thewchan
